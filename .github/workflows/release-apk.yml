name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  apk:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/CribScoreTrainer-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CribScoreTrainer-arm64
          path: dist/CribScoreTrainer-arm64.apk
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CribScoreTrainer-arm64.apk
          generate_release_notes: true
