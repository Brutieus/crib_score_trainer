name: crib_score_trainer
description: Offline cribbage hand and crib scorer with on-device card detection and a rules trainer.
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image: ^4.3.0
  permission_handler: ^11.3.1
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/crib_score_logo.jpg
  min_sdk_android: 26
  adaptive_icon_background: "#10291C"
  adaptive_icon_foreground: assets/branding/crib_score_logo.jpg
  web:
    generate: true
  windows:
    generate: true
    icon_size: 256
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/models/cards.tflite
    - assets/models/class_names.txt
